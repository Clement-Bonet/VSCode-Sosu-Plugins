name: CI

# main: stable; dev: integration; feature/*: one branch per feature, merged into dev
# through a pull request. Pull requests are checked before they are merged.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The jobs only read the repository: a workflow run by a pull request from a fork gets no more.
permissions:
  contents: read

jobs:
  extension:
    name: Tests and package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the latest release of Sosu, for the session with sosuc lsp (test/lsp.test.js)
      - name: Install sosuc
        run: curl -fsSL https://github.com/Clement-Bonet/Sosu/releases/latest/download/install.sh | sh
      - name: Tests (logic, sosuc lsp and highlighting)
        run: SOSUC="$HOME/.local/bin/sosuc" SOSU_LSP_TEST=required npm test
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: sosu-vsix
          path: "*.vsix"
